[package]
name = "querymt-desktop"
version = "0.1.0"
description = "QueryMT Desktop"
authors = ["QueryMT"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "2"
tauri = { version = "2", default-features = false, features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
toml = "1.0"
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "tls-ring", "tls-webpki-roots"] }
opentelemetry_sdk = { version = "0.32", features = ["trace"] }
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tonic = { version = "0.14", default-features = false, features = ["tls-webpki-roots"] }
tokio = { version = "1", features = ["time"] }

[target.'cfg(target_os = "linux")'.dependencies]
tauri-runtime-cef = { git = "https://github.com/SableClient/tauri-runtime-cef", rev = "eace83edf055acc17e811b2bc75d4b6eadf39670", optional = true }
cef = { version = "=150.2.1", optional = true }

[features]
default = ["wry"]
custom-protocol = ["tauri/custom-protocol"]
wry = ["tauri/wry"]
cef = ["dep:tauri-runtime-cef", "dep:cef"]

[lib]
name = "querymt_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
