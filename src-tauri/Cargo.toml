[package]
name = "querymt-desktop"
version = "0.1.0"
description = "QueryMT Desktop"
authors = ["QueryMT"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "2"
futures-util = "0.3"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tauri = { version = "2", default-features = false, features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
toml = "1.0"
opentelemetry = "0.33"
opentelemetry-otlp = { version = "0.33", features = ["grpc-tonic", "tls-ring", "tls-webpki-roots"] }
opentelemetry_sdk = { version = "0.33", features = ["trace"] }
tracing = "0.1"
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tonic = { version = "0.14", default-features = false, features = ["tls-webpki-roots"] }
tokio = { version = "1", features = ["macros", "sync", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Tauri's CEF runtime is not published yet; Sable ports the experimental runtime to released Tauri crates.
tauri-runtime-cef = { git = "https://github.com/SableClient/tauri-runtime-cef", rev = "47b0dad3689859797c12b59740a9cba998190f30", optional = true }
cef = { version = "=150.2.1", optional = true }

[features]
default = ["wry"]
custom-protocol = ["tauri/custom-protocol"]
wry = [
    "tauri/wry",
    "tauri/compression",
    "tauri/common-controls-v6",
    "tauri/dynamic-acl",
    "tauri/x11",
    "tauri/dbus",
]
cef = ["dep:tauri-runtime-cef", "dep:cef"]

[lib]
name = "querymt_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
