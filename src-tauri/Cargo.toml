[package]
name = "querymt-desktop"
version = "0.1.8"
description = "QueryMT Desktop"
authors = ["QueryMT"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "2"
dirs = "7"
futures-util = "0.3"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tauri = { version = "2", default-features = false, features = [] }
# Linux file chooser: use the xdg-desktop-portal instead of the default GTK3 dialog. A GTK3
# window opened from inside the CEF/Chromium runtime (especially on Wayland) renders as an
# empty black window. The features only affect Linux; macOS and Windows keep native dialogs.
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }
tauri-plugin-shell = "2"
toml = "1.0"
opentelemetry = "0.33"
opentelemetry-otlp = { version = "0.33", features = ["grpc-tonic", "tls-ring", "tls-webpki-roots"] }
opentelemetry_sdk = { version = "0.33", features = ["trace"] }
tracing = "0.1"
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tonic = { version = "0.14", default-features = false, features = ["tls-webpki-roots"] }
tokio = { version = "1", features = ["macros", "sync", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Tauri's CEF runtime is not published yet; Sable ports the experimental runtime to released Tauri crates.
# This revision supports tauri-runtime 2.12 while retaining CEF 150.
tauri-runtime-cef = { git = "https://github.com/SableClient/tauri-runtime-cef", rev = "a82eea03d36e19874efc5b2eef29086eb4948ce8", optional = true }
cef = { version = "=150.2.1", optional = true }

[features]
default = ["wry"]
custom-protocol = ["tauri/custom-protocol"]
wry = [
    "tauri/wry",
    "tauri/compression",
    "tauri/common-controls-v6",
    "tauri/dynamic-acl",
    "tauri/x11",
    "tauri/dbus",
]
cef = ["dep:tauri-runtime-cef", "dep:cef"]

[lib]
name = "querymt_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
