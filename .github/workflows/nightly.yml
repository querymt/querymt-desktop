name: nightly

# Builds QueryMT Desktop against the latest *nightly* qmtcode release of
# querymt/querymt and publishes a rolling `nightly` prerelease.
#
# Triggers:
#   - repository_dispatch (qmtcode-nightly): sent by querymt/querymt's nightly
#     workflow once its `nightly` release has been published. Skipped when
#     neither repository changed since the last desktop nightly.
#   - workflow_dispatch: ad-hoc build. Always builds, using whatever the
#     current querymt/querymt `nightly` release is.

on:
  repository_dispatch:
    types: [qmtcode-nightly]
  workflow_dispatch:

# Serialize runs: they all replace the same rolling `nightly` release.
concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

env:
  CORE_REPO: querymt/querymt
  CORE_RELEASE_TAG: nightly

jobs:
  check-changes:
    name: Check for changes since last nightly
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
      version_name: ${{ steps.version.outputs.name }}
      nightly_version: ${{ steps.version.outputs.version }}
      qmtcode_revision: ${{ steps.core.outputs.commit }}
      qmtcode_version: ${{ steps.core.outputs.version }}
      qmtcode_assets: ${{ steps.core.outputs.assets }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Test release scripts
        run: |
          node --test scripts/release/*.test.mjs scripts/release/lib/*.test.mjs
          bash scripts/release/test-collect-bundles.sh

      # Fail before building anything: an unsigned nightly must never be published.
      - name: Require updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is not set; nightly updater artifacts cannot be signed."
            exit 1
          fi

      # The qmtcode version and commit come from the release.json published with
      # the querymt nightly, never from asset names or notes. Every matrix job
      # downloads the asset URLs resolved here, so all artifacts of this nightly
      # bundle the same qmtcode.
      - name: Resolve latest QueryMT nightly release
        id: core
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DISPATCHED_VERSION: ${{ github.event.client_payload.querymt_version }}
          DISPATCHED_SHA: ${{ github.event.client_payload.querymt_sha }}
        run: |
          set -euo pipefail
          RESOLVED=$(node scripts/release/resolve-qmtcode.mjs nightly --repo "$CORE_REPO" --github-output)
          VERSION=$(jq -r .version <<<"$RESOLVED")
          COMMIT=$(jq -r .commit <<<"$RESOLVED")
          echo "Latest QueryMT nightly: $VERSION ($COMMIT)"

          # The dispatch payload is informational: a manual dispatch carries none,
          # and release.json stays the source of truth.
          if [ -n "$DISPATCHED_VERSION" ]; then
            echo "Dispatch announced QueryMT nightly $DISPATCHED_VERSION (${DISPATCHED_SHA})"
            if [ "$DISPATCHED_VERSION" != "$VERSION" ]; then
              echo "::warning::Dispatch announced $DISPATCHED_VERSION but the published nightly is $VERSION; using the published release.json."
            fi
          fi

      - name: Check for changes
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_CORE_SHA: ${{ steps.core.outputs.commit }}
          CURRENT_DESKTOP_SHA: ${{ github.sha }}
        run: |
          LAST_JSON=$(gh release view nightly --json targetCommitish,body 2>/dev/null || echo '{}')
          LAST_DESKTOP_SHA=$(jq -r '.targetCommitish // empty' <<<"$LAST_JSON")
          LAST_CORE_SHA=$(
            jq -r '.body // empty' <<<"$LAST_JSON" \
              | sed -n "s/^QueryMT: \`\([0-9a-f]\{40\}\)\`$/\1/p" \
              | head -n 1
          )

          if [ -z "$LAST_DESKTOP_SHA" ] \
            || [ "$LAST_DESKTOP_SHA" != "$CURRENT_DESKTOP_SHA" ] \
            || [ "$LAST_CORE_SHA" != "$CURRENT_CORE_SHA" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Desktop or QueryMT nightly changed, or this is the first nightly build"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No Desktop or QueryMT nightly changes since the last nightly"
          fi

      # <base>-nightly.<UTC YYYYMMDDHHMMSS>, computed once here and passed to
      # every matrix job so all artifacts of one nightly share a version.
      # `name` is the asset label, so the rolling release URLs stay stable.
      - name: Generate version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(node scripts/release/nightly-version.mjs "$(date -u +%Y%m%d%H%M%S)")
          echo "Nightly version: $VERSION"
          echo "name=nightly" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  versions:
    name: Version consistency
    uses: ./.github/workflows/versions.yml
    permissions:
      contents: read

  embedded-ui:
    name: Embedded UI
    needs: [check-changes, versions]
    if: needs.check-changes.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/embedded-ui.yml
    permissions:
      contents: read

  build:
    name: ${{ matrix.name }}
    needs: [check-changes, versions]
    if: needs.check-changes.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runtime: wry
            platform: macos-latest
            target: aarch64-apple-darwin
            qmtcode_target: aarch64-apple-darwin
            tauri_args: --target aarch64-apple-darwin --bundles app,dmg
            asset_prefix: QueryMT-Desktop
            asset_suffix: macos-aarch64
          - name: macOS Intel
            runtime: wry
            platform: macos-26-intel
            target: x86_64-apple-darwin
            qmtcode_target: x86_64-apple-darwin
            tauri_args: --target x86_64-apple-darwin --bundles app,dmg
            asset_prefix: QueryMT-Desktop
            asset_suffix: macos-x86_64
          - name: Windows x64
            runtime: wry
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            qmtcode_target: x86_64-pc-windows-msvc
            tauri_args: --target x86_64-pc-windows-msvc --bundles nsis
            asset_prefix: QueryMT-Desktop
            asset_suffix: windows-x64-setup
          - name: Linux x64 (Wry)
            runtime: wry
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            qmtcode_target: x86_64-unknown-linux-musl
            tauri_args: --target x86_64-unknown-linux-gnu --bundles appimage,deb
            asset_prefix: QueryMT-Desktop-wry
            asset_suffix: linux-x86_64
          - name: Linux arm64 (Wry)
            runtime: wry
            platform: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            qmtcode_target: aarch64-unknown-linux-musl
            tauri_args: --target aarch64-unknown-linux-gnu --bundles appimage,deb
            asset_prefix: QueryMT-Desktop-wry
            asset_suffix: linux-aarch64
          - name: Linux x64 (CEF)
            runtime: cef
            arch: x86_64
            asset_prefix: QueryMT-Desktop-cef
            asset_suffix: linux-x86_64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            qmtcode_target: x86_64-unknown-linux-musl
            nfpm_arch: x86_64
            nfpm_sha256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
            appimagetool_sha256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
            appimage_runtime_sha256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
          - name: Linux arm64 (CEF)
            runtime: cef
            arch: aarch64
            asset_prefix: QueryMT-Desktop-cef
            asset_suffix: linux-aarch64
            platform: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            qmtcode_target: aarch64-unknown-linux-musl
            nfpm_arch: arm64
            nfpm_sha256: a9a75213763783b7669719e505474c748c5ad7dc66591a195619deb50f85c2f4
            appimagetool_sha256: f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
            appimage_runtime_sha256: 00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444

    env:
      VERSION_NAME: ${{ needs.check-changes.outputs.version_name }}
      NIGHTLY_VERSION: ${{ needs.check-changes.outputs.nightly_version }}
      # Build metadata compiled into the app, and updater signing.
      QMT_RELEASE_CHANNEL: nightly
      QMTCODE_VERSION: ${{ needs.check-changes.outputs.qmtcode_version }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      REQUIRE_UPDATER_SIGNATURE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux Wry dependencies
        if: matrix.runtime == 'wry' && startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install CEF build dependencies
        if: matrix.runtime == 'cef'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake curl libasound2-dev libatk1.0-dev \
            libcups2-dev libdbus-1-dev libdrm-dev libgtk-3-dev libnss3-dev libx11-dev \
            libwebkit2gtk-4.1-dev libxcomposite-dev libxdamage-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxrandr-dev ninja-build patchelf pkg-config xz-utils

      - name: Install CEF packaging tools
        if: matrix.runtime == 'cef'
        env:
          NFPM_ARCH: ${{ matrix.nfpm_arch }}
          NFPM_VERSION: '2.48.0'
          NFPM_SHA256: ${{ matrix.nfpm_sha256 }}
          APPIMAGE_ARCH: ${{ matrix.arch }}
          APPIMAGETOOL_SHA256: ${{ matrix.appimagetool_sha256 }}
          APPIMAGE_RUNTIME_VERSION: '20251108'
          APPIMAGE_RUNTIME_SHA256: ${{ matrix.appimage_runtime_sha256 }}
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_${NFPM_ARCH}.tar.gz"
          echo "${NFPM_SHA256}  /tmp/nfpm.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/nfpm.tar.gz -C "$HOME/.local/bin" nfpm
          curl -fsSL -o "$HOME/.local/bin/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${APPIMAGE_ARCH}.AppImage"
          echo "${APPIMAGETOOL_SHA256}  $HOME/.local/bin/appimagetool" | sha256sum --check --strict
          curl -fsSL -o "$HOME/.local/bin/appimage-runtime" \
            "https://github.com/AppImage/type2-runtime/releases/download/${APPIMAGE_RUNTIME_VERSION}/runtime-${APPIMAGE_ARCH}"
          echo "${APPIMAGE_RUNTIME_SHA256}  $HOME/.local/bin/appimage-runtime" | sha256sum --check --strict
          chmod +x "$HOME/.local/bin/nfpm" "$HOME/.local/bin/appimagetool" \
            "$HOME/.local/bin/appimage-runtime"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        run: npm ci

      - name: Download nightly qmtcode sidecar
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          QMTCODE_ASSET_NAME: ${{ fromJSON(needs.check-changes.outputs.qmtcode_assets)[matrix.qmtcode_target].name }}
          QMTCODE_ASSET_URL: ${{ fromJSON(needs.check-changes.outputs.qmtcode_assets)[matrix.qmtcode_target].api_url }}
          QMTCODE_ASSET_DIGEST: ${{ fromJSON(needs.check-changes.outputs.qmtcode_assets)[matrix.qmtcode_target].digest }}
          TAURI_TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          if (-not $env:QMTCODE_ASSET_URL -or -not $env:QMTCODE_ASSET_DIGEST) {
            throw "No pinned qmtcode asset (id URL and sha256 digest) resolved for ${{ matrix.qmtcode_target }}."
          }
          $asset = [pscustomobject]@{
            name = $env:QMTCODE_ASSET_NAME
            api_url = $env:QMTCODE_ASSET_URL
            digest = $env:QMTCODE_ASSET_DIGEST
          }

          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          New-Item -ItemType Directory -Force -Path qmtcode-extract | Out-Null
          $archive = Join-Path $PWD $asset.name
          # Download by asset id: if querymt replaced the release since it was resolved,
          # the id no longer exists and this fails instead of fetching a different build.
          $headers['Accept'] = 'application/octet-stream'
          Invoke-WebRequest -Headers $headers -Uri $asset.api_url -OutFile $archive
          $actual = 'sha256:' + (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLowerInvariant()
          if ($actual -ne $asset.digest) {
            throw "$($asset.name) does not match the resolved digest ($actual != $($asset.digest))."
          }

          if ($asset.name.EndsWith('.zip')) {
            Expand-Archive -Path $archive -DestinationPath qmtcode-extract -Force
          } else {
            tar -xzf $archive -C qmtcode-extract
          }

          $binary = Get-ChildItem -Path qmtcode-extract -Recurse -File |
            Where-Object { $_.Name -eq 'qmtcode' -or $_.Name -eq 'qmtcode.exe' } |
            Select-Object -First 1
          if (-not $binary) {
            throw "Downloaded qmtcode archive did not contain a qmtcode executable."
          }

          $extension = if ($env:RUNNER_OS -eq 'Windows') { '.exe' } else { '' }
          $destination = Join-Path 'src-tauri/binaries' "qmtcode-$env:TAURI_TARGET$extension"
          Copy-Item -Path $binary.FullName -Destination $destination -Force
          if ($env:RUNNER_OS -ne 'Windows') {
            chmod +x $destination
          }

          $tauriConfigPath = 'src-tauri/tauri.conf.json'
          $tauriConfig = Get-Content $tauriConfigPath -Raw | ConvertFrom-Json
          $tauriConfig.bundle | Add-Member -NotePropertyName externalBin -NotePropertyValue @('binaries/qmtcode') -Force
          $tauriConfig | ConvertTo-Json -Depth 20 | Set-Content $tauriConfigPath

      # Stamp the app version (the same <base>-nightly.<timestamp> the feed
      # carries) in the CI workspace only; versions.yml already validated the
      # committed files.
      - name: Stamp nightly version
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const path = "src-tauri/tauri.conf.json";
            const config = JSON.parse(fs.readFileSync(path, "utf8"));
            config.version = process.env.NIGHTLY_VERSION;
            fs.writeFileSync(path, JSON.stringify(config, null, 2) + "\n");
            console.log("Nightly version: " + config.version);
          '

      - name: Build Tauri bundles (Wry)
        if: matrix.runtime == 'wry'
        shell: bash
        run: npm run tauri:wry -- build ${{ matrix.tauri_args }}

      - name: Build Linux CEF binary
        if: matrix.runtime == 'cef'
        run: npm run tauri:cef -- build --target ${{ matrix.target }}

      - name: Package Linux CEF bundles
        if: matrix.runtime == 'cef'
        run: |
          APPIMAGE_RUNTIME_FILE="$HOME/.local/bin/appimage-runtime" \
            npm run package:cef -- "$NIGHTLY_VERSION" ${{ matrix.target }}

      - name: Collect nightly assets
        shell: bash
        env:
          RUNTIME: ${{ matrix.runtime }}
          TARGET: ${{ matrix.target }}
          ASSET_PREFIX: ${{ matrix.asset_prefix }}
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
        run: bash scripts/release/collect-bundles.sh

      - name: Upload nightly assets
        uses: actions/upload-artifact@v7
        with:
          name: nightly-${{ matrix.runtime }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish-nightly:
    name: Publish Nightly Release
    needs: [check-changes, embedded-ui, build]
    if: needs.check-changes.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION_NAME: ${{ needs.check-changes.outputs.version_name }}
      NIGHTLY_VERSION: ${{ needs.check-changes.outputs.nightly_version }}
      QMTCODE_VERSION: ${{ needs.check-changes.outputs.qmtcode_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Download desktop bundles
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
          pattern: 'nightly-*'
          merge-multiple: true

      - name: Download embedded UI artifact
        uses: actions/download-artifact@v8
        with:
          name: querymt-embedded-ui
          path: embedded-ui

      - name: Name embedded UI release assets
        run: |
          test -f embedded-ui/querymt-embedded-ui.tar.gz
          test -f embedded-ui/build-embedded/index.html
          test -f embedded-ui/build-embedded/querymt-ui.json
          grep -q '"target": "embedded"' embedded-ui/build-embedded/querymt-ui.json
          grep -q '"acpWebSocketPath": "/acp/ws"' embedded-ui/build-embedded/querymt-ui.json

          cp embedded-ui/querymt-embedded-ui.tar.gz "artifacts/querymt-embedded-ui-${VERSION_NAME}.tar.gz"

      # The commit SHAs live in the notes only; they are not part of any version.
      # The `QueryMT: <sha>` line is parsed by the next run's check-changes.
      - name: Write release notes
        env:
          DESKTOP_SHA: ${{ github.sha }}
          QMTCODE_REVISION: ${{ needs.check-changes.outputs.qmtcode_revision }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          **This is a pre-release nightly build of QueryMT Desktop.**

          It is not intended for production use.

          Version: \`${NIGHTLY_VERSION}\`
          Commit: \`${DESKTOP_SHA}\`
          QueryMT: \`${QMTCODE_REVISION}\`
          Bundled qmtcode: \`${QMTCODE_VERSION}\`
          EOF

      # The feed is untrusted by the app; the qmtcode version it reads comes from this
      # manifest, signed with the updater key and bound to the desktop version (design D12).
      - name: Install the Tauri CLI for signing
        run: npm ci --ignore-scripts

      - name: Sign the release manifest
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          node scripts/release/updater-feed.mjs --write-manifest manifest.json \
            --dist artifacts --version-name "$VERSION_NAME" \
            --version "$NIGHTLY_VERSION" --qmtcode-version "$QMTCODE_VERSION"
          npx --no-install tauri signer sign --app-version "$NIGHTLY_VERSION" manifest.json
          test -s manifest.json.sig

      # Fails, and publishes nothing, when any platform artifact, signature or the
      # release manifest is missing or does not verify against the updater public key.
      - name: Generate updater feed
        env:
          UPDATER_VERIFY_PUBKEY: ${{ vars.UPDATER_VERIFY_PUBKEY }}
        run: |
          set -euo pipefail
          # Key rotation only: the old public key that signed this release's artifacts
          # (repository variable UPDATER_VERIFY_PUBKEY). Unset for normal releases.
          VERIFY_ARGS=()
          if [ -n "${UPDATER_VERIFY_PUBKEY:-}" ]; then
            VERIFY_ARGS=(--verify-pubkey "$UPDATER_VERIFY_PUBKEY")
          fi
          node scripts/release/updater-feed.mjs \
            "${VERIFY_ARGS[@]}" \
            --dist artifacts \
            --version-name "$VERSION_NAME" \
            --version "$NIGHTLY_VERSION" \
            --base-url "https://github.com/${GH_REPO}/releases/download/nightly" \
            --qmtcode-version "$QMTCODE_VERSION" \
            --manifest-signature manifest.json.sig \
            --pubkey-from src-tauri/tauri.conf.json \
            --notes-file notes.md \
            --out artifacts/latest.json

      # The signatures are embedded in latest.json, which is all the updater reads.
      # The generator has already verified every .sig; don't publish them separately.
      - name: Drop detached signatures
        run: rm -f artifacts/*.sig

      # One combined checksum file instead of a .sha256 file per asset.
      - name: Generate SHA256SUMS
        working-directory: artifacts
        run: |
          set -euo pipefail
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          ls -l

      # The rolling release is replaced in three steps so the time without a
      # `nightly` release is a few seconds instead of the whole upload:
      #   1. upload everything to a draft release under a staging tag
      #      (drafts are invisible to the public and create no git tag),
      #   2. delete the previous `nightly` release and tag,
      #   3. retag the draft as `nightly` at this commit and publish it.
      # If the upload fails, the previous nightly is left untouched.
      - name: Create staging draft release
        id: draft
        env:
          DESKTOP_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Remove drafts left behind by an earlier failed run.
          for id in $(gh api "repos/${GH_REPO}/releases" --paginate \
            --jq '.[] | select(.draft and .tag_name == "nightly-staging") | .id'); do
            gh api -X DELETE "repos/${GH_REPO}/releases/${id}"
          done

          gh release create nightly-staging \
            --draft \
            --title "Nightly Build (${NIGHTLY_VERSION})" \
            --notes-file notes.md \
            --prerelease \
            --target "$DESKTOP_SHA" \
            artifacts/*

          ID=$(gh api "repos/${GH_REPO}/releases" --paginate \
            --jq '.[] | select(.draft and .tag_name == "nightly-staging") | .id')
          test -n "$ID"
          test "$(wc -l <<<"$ID")" -eq 1
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Delete previous nightly release
        run: |
          set -euo pipefail
          if gh release view nightly >/dev/null 2>&1; then
            gh release delete nightly --yes --cleanup-tag
          fi
          # A leftover tag without a release would stop the publish below from
          # creating the tag at the new commit.
          if gh api "repos/${GH_REPO}/git/ref/tags/nightly" >/dev/null 2>&1; then
            gh api -X DELETE "repos/${GH_REPO}/git/refs/tags/nightly"
          fi

      - name: Publish nightly release
        env:
          DESKTOP_SHA: ${{ github.sha }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: |
          set -euo pipefail
          gh api -X PATCH "repos/${GH_REPO}/releases/${RELEASE_ID}" \
            -f tag_name=nightly \
            -f target_commitish="$DESKTOP_SHA" \
            -F draft=false \
            -F prerelease=true

          # The tag must now point at this commit; check-changes relies on it.
          TAG_SHA=$(gh api "repos/${GH_REPO}/git/ref/tags/nightly" --jq '.object.sha')
          if [ "$TAG_SHA" != "$DESKTOP_SHA" ]; then
            echo "::error::nightly tag points at ${TAG_SHA}, expected ${DESKTOP_SHA}"
            exit 1
          fi

      # The published feed must be what the installed apps will read.
      - name: Verify published feed
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            curl -fsSL "https://github.com/${GH_REPO}/releases/download/nightly/latest.json" -o published.json && break
            sleep 5
          done
          jq -e --arg v "$NIGHTLY_VERSION" '.version == $v and (.platforms | length) == 7' published.json
          jq -c '{version, qmtcode_version, platforms: (.platforms | keys)}' published.json
