name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  embedded-ui:
    name: Embedded UI
    uses: ./.github/workflows/embedded-ui.yml
    permissions:
      contents: read

  publish-embedded-ui:
    name: Publish Embedded UI
    needs: embedded-ui
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download embedded UI artifact
        uses: actions/download-artifact@v8
        with:
          name: querymt-embedded-ui
          path: embedded-ui

      - name: Name versioned release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test -f embedded-ui/querymt-embedded-ui.tar.gz
          test -f embedded-ui/build-embedded/index.html
          test -f embedded-ui/build-embedded/querymt-ui.json
          grep -q '"target": "embedded"' embedded-ui/build-embedded/querymt-ui.json
          grep -q '"acpWebSocketPath": "/acp/ws"' embedded-ui/build-embedded/querymt-ui.json

          cp embedded-ui/querymt-embedded-ui.tar.gz "querymt-embedded-ui-${RELEASE_TAG}.tar.gz"
          sha256sum "querymt-embedded-ui-${RELEASE_TAG}.tar.gz" > "querymt-embedded-ui-${RELEASE_TAG}.tar.gz.sha256"

      - name: Upload embedded UI to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --draft \
              --title "QueryMT Desktop ${RELEASE_TAG}" \
              --notes "Desktop release for QueryMT Desktop." \
              || gh release view "$RELEASE_TAG" >/dev/null
          fi
          gh release upload "$RELEASE_TAG" \
            "querymt-embedded-ui-${RELEASE_TAG}.tar.gz" \
            "querymt-embedded-ui-${RELEASE_TAG}.tar.gz.sha256" \
            --clobber

  release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runtime: wry
            platform: macos-latest
            target: aarch64-apple-darwin
            qmtcode_asset_glob: qmtcode-*-aarch64-apple-darwin.tar.gz
            tauri_args: --target aarch64-apple-darwin --bundles dmg
          - name: macOS Intel
            runtime: wry
            platform: macos-latest
            target: x86_64-apple-darwin
            qmtcode_asset_glob: qmtcode-*-x86_64-apple-darwin.tar.gz
            tauri_args: --target x86_64-apple-darwin --bundles dmg
          - name: Windows x64
            runtime: wry
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            qmtcode_asset_glob: qmtcode-*-x86_64-pc-windows-msvc.zip
            tauri_args: --target x86_64-pc-windows-msvc --bundles nsis
          - name: Linux x64 (Wry)
            runtime: wry
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            qmtcode_asset_glob: qmtcode-*-x86_64-unknown-linux-musl.tar.gz
            tauri_args: --target x86_64-unknown-linux-gnu --bundles appimage,deb
          - name: Linux arm64 (Wry)
            runtime: wry
            platform: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            qmtcode_asset_glob: qmtcode-*-aarch64-unknown-linux-musl.tar.gz
            tauri_args: --target aarch64-unknown-linux-gnu --bundles appimage,deb
          - name: Linux x64 (CEF)
            runtime: cef
            arch: x86_64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            qmtcode_asset_glob: qmtcode-*-x86_64-unknown-linux-musl.tar.gz
            nfpm_arch: x86_64
          - name: Linux arm64 (CEF)
            runtime: cef
            arch: aarch64
            platform: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            qmtcode_asset_glob: qmtcode-*-aarch64-unknown-linux-musl.tar.gz
            nfpm_arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux Wry dependencies
        if: matrix.runtime == 'wry' && startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install CEF build dependencies
        if: matrix.runtime == 'cef'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake curl libasound2-dev libatk1.0-dev \
            libcups2-dev libdbus-1-dev libdrm-dev libgtk-3-dev libnss3-dev libx11-dev \
            libwebkit2gtk-4.1-dev libxcomposite-dev libxdamage-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxrandr-dev ninja-build patchelf pkg-config xz-utils

      - name: Install CEF packaging tools
        if: matrix.runtime == 'cef'
        env:
          NFPM_ARCH: ${{ matrix.nfpm_arch }}
          APPIMAGE_ARCH: ${{ matrix.arch }}
          APPIMAGE_RUNTIME_VERSION: '20251108'
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_${NFPM_ARCH}.tar.gz"
          tar -xzf /tmp/nfpm.tar.gz -C "$HOME/.local/bin" nfpm
          curl -fsSL -o "$HOME/.local/bin/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${APPIMAGE_ARCH}.AppImage"
          curl -fsSL -o "$HOME/.local/bin/appimage-runtime" \
            "https://github.com/AppImage/type2-runtime/releases/download/${APPIMAGE_RUNTIME_VERSION}/runtime-${APPIMAGE_ARCH}"
          chmod +x "$HOME/.local/bin/nfpm" "$HOME/.local/bin/appimagetool" \
            "$HOME/.local/bin/appimage-runtime"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        run: npm ci

      - name: Download latest qmtcode sidecar
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          QMTCODE_ASSET_GLOB: ${{ matrix.qmtcode_asset_glob }}
          TAURI_TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $release = Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/querymt/querymt/releases/latest'
          $asset = $release.assets | Where-Object { $_.name -like $env:QMTCODE_ASSET_GLOB } | Select-Object -First 1
          if (-not $asset) {
            throw "No qmtcode asset matching '$env:QMTCODE_ASSET_GLOB' found in $($release.tag_name)."
          }

          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          New-Item -ItemType Directory -Force -Path qmtcode-extract | Out-Null
          $archive = Join-Path $PWD $asset.name
          Invoke-WebRequest -Headers $headers -Uri $asset.browser_download_url -OutFile $archive

          if ($asset.name.EndsWith('.zip')) {
            Expand-Archive -Path $archive -DestinationPath qmtcode-extract -Force
          } else {
            tar -xzf $archive -C qmtcode-extract
          }

          $binary = Get-ChildItem -Path qmtcode-extract -Recurse -File |
            Where-Object { $_.Name -eq 'qmtcode' -or $_.Name -eq 'qmtcode.exe' } |
            Select-Object -First 1
          if (-not $binary) {
            throw "Downloaded qmtcode archive did not contain a qmtcode executable."
          }

          $extension = if ($env:RUNNER_OS -eq 'Windows') { '.exe' } else { '' }
          $destination = Join-Path 'src-tauri/binaries' "qmtcode-$env:TAURI_TARGET$extension"
          Copy-Item -Path $binary.FullName -Destination $destination -Force
          if ($env:RUNNER_OS -ne 'Windows') {
            chmod +x $destination
          }

          $tauriConfigPath = 'src-tauri/tauri.conf.json'
          $tauriConfig = Get-Content $tauriConfigPath -Raw | ConvertFrom-Json
          $tauriConfig.bundle | Add-Member -NotePropertyName externalBin -NotePropertyValue @('binaries/qmtcode') -Force
          $tauriConfig | ConvertTo-Json -Depth 20 | Set-Content $tauriConfigPath

          "QMTCODE_VERSION=$($release.tag_name)" >> $env:GITHUB_ENV
          "QMTCODE_ASSET=$($asset.name)" >> $env:GITHUB_ENV

      - name: Build and publish Tauri bundles
        if: matrix.runtime == 'wry'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: QueryMT Desktop ${{ github.ref_name }}
          releaseBody: |
            Desktop release for QueryMT Desktop.

            Bundled qmtcode: ${{ env.QMTCODE_VERSION }} (${{ env.QMTCODE_ASSET }})
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.tauri_args }}

      - name: Build Linux CEF binary
        if: matrix.runtime == 'cef'
        run: npm run tauri:cef -- build --target ${{ matrix.target }}

      - name: Package Linux CEF bundles
        if: matrix.runtime == 'cef'
        run: |
          APPIMAGE_RUNTIME_FILE="$HOME/.local/bin/appimage-runtime" \
            npm run package:cef -- "${GITHUB_REF_NAME#v}" ${{ matrix.target }}

      - name: Upload CEF bundles to draft release
        if: matrix.runtime == 'cef'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --draft \
              --title "QueryMT Desktop ${RELEASE_TAG}" \
              --notes "Desktop release for QueryMT Desktop." \
              || gh release view "$RELEASE_TAG" >/dev/null
          fi
          gh release upload "$RELEASE_TAG" \
            src-tauri/target/release/bundle/appimage/* \
            src-tauri/target/release/bundle/deb/* \
            src-tauri/target/release/bundle/tar/* \
            --clobber
